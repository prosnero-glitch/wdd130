<!DOCTYPE html>

        <meta name="description"
      content="Contact Exciting Expeditions for rafting trip information, booking help, and questions.">

    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/logo-excitingexpedition.jpg" alt="Exciting Expedition rafting company logo.">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>
            Kolob, California<br>
            +1 999 999 9999<br>
            info@whitewater.com</p>
            <div class="contact-layout">
    <div class="contact-map">
        <!-- Add the map or iframe here -->
         <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6797440.316401241!2d4.325648759054512!3d8.396455803607255!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x104e0baf7da48d0d%3A0x99a8fe4168c50bc8!2sNigeria!5e0!3m2!1sen!2sng!4v1795883488883!5m2!1sen!2sng" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
           </div>
         <form  class="contact-form" action="https://formspree.io/f/mnqvayqv" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br><label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
<p>Message Purpose</p><br>
            <label>
                <input type="radio" id="purpose1" name="purpose" value="General Inquiry" required>
                <label for="purpose1">General Inquiry</label><br>
                <input type="radio" id="purpose2" name="purpose" value="Reservation Question">
                <label for="purpose2">Reservation Question</label><br>
                <input type="radio" id="purpose3" name="purpose" value="Website Suggestion">
                <label for="purpose3">Website Suggestion</label>
            </label> <br>
            <p>Message</p>
           
            <textarea id="message" name="message" rows="5" required></textarea><br>
            <label>
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Please Subscribe me to the Monthly newsletter</label>
            </label>

            <button type="submit">Get in Touch</button>
         
         </form>
  

    
        <div class="employees">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/team-spirit.jpg" alt="team spirit">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/on-the-rock.jpg" alt="on the rock">
                <figcaption>Employee Profile </figcaption>
            </figure>
            <figure>
                <img src="images/on-the-rock.jpg" alt="on the rock">
                <figcaption> Employee Profile </figcaption>
            </figure>
           
        </div>
    </main>

    </footer>
